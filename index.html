<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7f3"><title>Món quà 20/10 · Innovation P</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;overflow-x:hidden;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#79425b;background:radial-gradient(ellipse at top left,#ffe0e5,transparent 60%),radial-gradient(ellipse at bottom right,#fff0d2,transparent 58%),#fff8f4}body:before,body:after{content:'✦';position:fixed;z-index:-1;color:#f2a5bf99;font-size:32px;pointer-events:none;animation:float 8s ease-in-out infinite}body:before{top:13%;left:7%}body:after{right:8%;bottom:12%;font-size:48px;color:#f3c77388;animation-delay:-4s}@keyframes float{50%{transform:translateY(-25px) rotate(18deg)}}main{max-width:890px;margin:auto;padding:27px 13px 40px;text-align:center}.eyebrow{font-size:12px;letter-spacing:.21em;color:#b67d86;font-weight:800}h1{font-family:Georgia,serif;font-size:clamp(2.9rem,8vw,5rem);line-height:1.12;color:#b94772;margin:15px auto 8px;text-shadow:0 4px 18px #d66b8a22}p{line-height:1.6}.intro{max-width:590px;margin:0 auto 23px;color:#94667b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:670px;margin:auto}button{font:inherit}.gift{position:relative;overflow:hidden;cursor:pointer;min-height:240px;border:1px solid white;border-radius:24px;background:linear-gradient(135deg,#fff,#ffe6ed);color:#913e61;box-shadow:0 14px 30px #b3788626;padding:16px 6px;display:flex;align-items:center;justify-content:center;gap:10px;flex-direction:column;transition:transform .25s,box-shadow .25s}.gift:before{content:'';position:absolute;inset:-40%;background:linear-gradient(120deg,transparent 43%,#ffffffc9 50%,transparent 57%);transform:translateX(-70%) rotate(8deg);transition:transform .65s}.gift:hover:before,.gift:focus-visible:before{transform:translateX(70%) rotate(8deg)}.gift:nth-child(2){background:linear-gradient(135deg,#fff,#f4e6f8)}.gift:nth-child(3){background:linear-gradient(135deg,#fff,#fff1dc)}.gift:nth-child(4){background:linear-gradient(135deg,#fff,#e6f8f2)}.gift:hover,.gift:focus-visible{transform:translateY(-5px) scale(1.01);box-shadow:0 18px 35px #b3788640}.gift strong,.gift small,.gift-emoji{position:relative;z-index:1}.gift strong{font-family:Georgia,serif;font-size:1.45rem}.gift small{color:#a57e90}.gift-emoji{font-size:95px;line-height:1;filter:drop-shadow(0 12px 5px #b4647e20);transition:transform .4s}.gift.opening{animation:gift-pop .32s ease-out}.gift.opening:after{content:'';position:absolute;inset:50%;border-radius:50%;background:#fff9;animation:gift-glow .65s ease-out forwards}.gift.opening .gift-emoji{animation:open .65s cubic-bezier(.2,.8,.25,1) forwards}@keyframes gift-pop{50%{transform:scale(.94)}100%{transform:scale(1.03)}}@keyframes gift-glow{to{inset:-50%;opacity:0}}@keyframes open{38%{transform:scale(1.42) rotate(-16deg)}100%{transform:scale(.82) rotate(15deg)}}.foot{margin-top:26px;font-size:13px;color:#a16e85}.overlay[hidden]{display:none!important}.overlay{position:fixed;inset:0;display:flex;z-index:20;align-items:center;justify-content:center;background:#4e263bba;backdrop-filter:blur(7px);padding:9px;animation:veil .28s ease-out}@keyframes veil{from{opacity:0}to{opacity:1}}.modal{position:relative;width:min(100%,530px);max-height:96dvh;overflow:auto;border-radius:18px;background:#fffaf9;padding:9px;box-shadow:0 16px 60px #37172b77;animation:up .42s cubic-bezier(.2,.85,.25,1)}@keyframes up{from{opacity:0;transform:translateY(36px) scale(.9)}to{opacity:1;transform:none}}.card-img{display:block;width:100%;height:auto;border-radius:11px;animation:card-in .45s .07s both}@keyframes card-in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}.close{position:sticky;top:4px;float:right;margin-bottom:-40px;border:none;z-index:3;background:#ffeff2;color:#984061;box-shadow:0 2px 10px #7443;border-radius:50%;width:38px;height:38px;font-size:27px;cursor:pointer;transition:transform .2s}.close:hover{transform:rotate(90deg)}.save{display:block;width:100%;margin-top:10px;border:0;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,#df5c91,#b62d65);padding:14px 8px;font-weight:750;color:#fff;text-align:center;font-size:14px;box-shadow:0 7px 16px #b62d6540;transition:transform .2s,box-shadow .2s}.save:hover,.save:focus-visible{transform:translateY(-2px);box-shadow:0 10px 20px #b62d6555}.save:disabled{opacity:.72;transform:none}.confetti{position:fixed;top:-30px;z-index:30;width:8px;height:15px;pointer-events:none;animation:fall 1.8s linear forwards}@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(800deg);opacity:0}}.spark{position:fixed;z-index:31;pointer-events:none;font-size:22px;animation:spark .7s ease-out forwards}@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(.25) rotate(100deg);opacity:0}}@media(max-width:500px){main{padding-top:20px}.grid{gap:10px}.gift{min-height:193px;border-radius:18px}.gift-emoji{font-size:73px}.gift strong{font-size:1.2rem}.gift small{font-size:11px}.intro{font-size:13px}.eyebrow{font-size:10px}.modal{max-height:97dvh}.save{padding:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main><div class="eyebrow">🌸 BỘ PHẬN INNOVATION P · 20/10 🌸</div><h1>Món quà nhỏ<br>gửi bạn</h1><p class="intro">Bốn món quà nhỏ, bốn lời chúc yêu thương. Hãy chọn hộp quà mang tên mình để khám phá bất ngờ nhé!</p><section class="grid" id="gifts"></section><div class="foot">💗 Chúc các bạn luôn rạng rỡ và hạnh phúc! — Innovation P</div></main><div class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-label="Thiệp chúc mừng"><div class="modal"><button type="button" class="close" id="close" aria-label="Đóng">×</button><img class="card-img" id="card" alt="Thiệp chúc mừng 20/10"/><button id="save" class="save" type="button">⬇ Lưu voucher về máy</button></div></div><script>
'use strict';const people=[['thuong','Thương'],['duyen','Duyên'],['quynh','Quỳnh'],['huyen','Huyền']],assetVersion='20261020-7';const grid=document.getElementById('gifts'),overlay=document.getElementById('overlay'),card=document.getElementById('card'),save=document.getElementById('save');let trigger=null,currentVoucher=null;const images={},barcodes={};const assetPath=(folder,id,extension)=>'assets/'+folder+'/'+id+extension+'?v='+assetVersion;for(const [id] of people){const cardImage=new Image(),barcodeImage=new Image();cardImage.src=assetPath('cards',id,'.jpg');barcodeImage.src=assetPath('barcodes',id,'.png');images[id]=cardImage;barcodes[id]=barcodeImage;}for(const [id,name] of people){const btn=document.createElement('button');btn.className='gift';btn.innerHTML='<span class="gift-emoji" aria-hidden="true">🎁</span><strong>Ms '+name+'</strong><small>Chạm để mở quà ✨</small>';btn.addEventListener('click',()=>openGift(id,name,btn));grid.appendChild(btn);}function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<38;i++){const c=document.createElement('span');c.className='confetti';c.style.left=(4+Math.random()*92)+'vw';c.style.background=['#eba4b9','#ffd08a','#e6bcf6','#90d8c0'][i%4];c.style.setProperty('--dx',(Math.random()*220-110)+'px');document.body.appendChild(c);c.addEventListener('animationend',()=>c.remove(),{once:true});}}function sparks(btn){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const r=btn.getBoundingClientRect();for(let i=0;i<10;i++){const s=document.createElement('span');s.className='spark';s.textContent=i%2?'✦':'♡';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',(Math.random()*250-125)+'px');s.style.setProperty('--y',(Math.random()*-220-25)+'px');document.body.appendChild(s);s.addEventListener('animationend',()=>s.remove(),{once:true});}}function prepareVoucher(voucher){fetch(voucher.path).then(response=>{if(!response.ok)throw new Error('Không tải được ảnh');return response.blob()}).then(blob=>{voucher.file=new File([blob],voucher.name,{type:'image/png'})}).catch(()=>{});}function openGift(id,name,btn){if(trigger)return;trigger=btn;btn.classList.add('opening');confetti();sparks(btn);card.src=images[id].src;card.alt='Thiệp 20/10 gửi Ms '+name;currentVoucher={path:barcodes[id].src,name:'Voucher_WinMart_Ms_'+id+'.png',file:null};prepareVoucher(currentVoucher);setTimeout(()=>{overlay.hidden=false;document.body.style.overflow='hidden';document.getElementById('close').focus()},matchMedia('(prefers-reduced-motion:reduce)').matches?0:240)}function downloadForAndroid(voucher){const link=document.createElement('a');link.href=voucher.file?URL.createObjectURL(voucher.file):voucher.path;link.download=voucher.name;document.body.appendChild(link);link.click();link.remove();if(voucher.file)setTimeout(()=>URL.revokeObjectURL(link.href),1000)}function saveVoucher(){if(!currentVoucher)return;if(/Android/i.test(navigator.userAgent)){downloadForAndroid(currentVoucher);return;}if(currentVoucher.file&&navigator.canShare&&navigator.canShare({files:[currentVoucher.file]})){navigator.share({files:[currentVoucher.file],title:'Voucher WinMart+'}).catch(()=>{});return;}window.open(currentVoucher.path,'_blank','noopener');}function closeGift(){overlay.hidden=true;document.body.style.overflow='';if(trigger){trigger.classList.remove('opening');trigger.focus();trigger=null}}save.addEventListener('click',saveVoucher);document.getElementById('close').addEventListener('click',closeGift);overlay.addEventListener('click',e=>{if(e.target===overlay)closeGift()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)closeGift()});
</script></body></html>
